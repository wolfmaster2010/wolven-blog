<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolven Fiber Co. — Blog</title>
<meta name="description" content="Knitting and crochet patterns from Wolven Fiber Co. — coming soon. Handmade knitwear from Michigan, from my den to your home.">
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf6ef;
    color: #2e2a26;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { text-align: center; max-width: 34rem; }
  img.logo { width: 180px; height: 180px; border-radius: 50%; }
  h1 { font-size: 2rem; margin-top: 1.25rem; letter-spacing: 0.02em; }
  .tagline { font-style: italic; color: #7a6a55; margin-top: 0.35rem; }
  .note { margin-top: 1.75rem; font-size: 1.1rem; line-height: 1.6; }
  a.shop {
    display: inline-block;
    margin-top: 1.75rem;
    padding: 0.7rem 1.6rem;
    background: #2e2a26;
    color: #faf6ef;
    text-decoration: none;
    border-radius: 999px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }
  a.shop:hover { background: #4a4239; }
  footer { margin-top: 2.5rem; font-size: 0.85rem; color: #9a8a76; }
</style>
</head>
<body>
<main>
  <img class="logo" src="wolven-logo.png" alt="Wolven Fiber Co. logo">
  <h1>Wolven Fiber Co.</h1>
  <p class="tagline">From my den to your home</p>
  <p class="note">The blog is on its way — knitting and crochet patterns,
  handmade in Michigan and shared stitch by stitch. Until the first
  pattern drops, the shop is open:</p>
  <a class="shop" href="https://wolvenfiberco.com">Visit the Shop</a>
  <footer>© 2026 Wolven Fiber Co. · Lansing, Michigan</footer>
</main>
</body>
</html>
